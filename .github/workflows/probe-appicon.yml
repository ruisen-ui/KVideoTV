name: Probe tvOS AppIcon

# 诊断用：查清这版工程构建出的 ipa 在 Apple TV 上为什么没有图标。
# 排查完可以删掉这个文件和 .github/probe-appicon.py。
#
# 为什么要回写仓库：GitHub 的 job 日志匿名下载返回 403（需要 admin 权限），
# 直接看不了。所以把结果写成 probe-result.txt 提交回 main，本机 git pull 就能读。

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-appicon.yml"
      - ".github/probe-appicon.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: 跑探针
        run: |
          set -uo pipefail
          python3 .github/probe-appicon.py > probe-result.txt 2>&1 || true
          echo "---------- 结果预览（末尾 60 行）----------"
          tail -60 probe-result.txt

      - name: 结果提交回仓库
        if: always()
        run: |
          set -uo pipefail
          if [ ! -s probe-result.txt ]; then
            echo "探针没产出内容，写一条说明"
            echo "probe produced no output" > probe-result.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-result.txt
          git commit -m "probe result [skip ci]" || echo "(没有变化，跳过)"
          git push origin HEAD:main || echo "(推送失败)"

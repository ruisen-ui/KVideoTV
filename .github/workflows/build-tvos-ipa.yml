name: Build tvOS IPA (unsigned)

# 云端编译出未签名的 KVideoTV.ipa，供本地用 Sideloadly 签名安装到 Apple TV。
# 这样本机不需要安装 Xcode。
#
# 触发：仓库 Actions 页面点 "Run workflow"，或推到 main 分支。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "KVideoTV/**"
      - ".github/workflows/build-tvos-ipa.yml"
      - ".github/build-tvos.sh"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 与 SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: 编译 tvOS（不签名，自动选出带图标的方案）
        run: bash .github/build-tvos.sh

      - name: 打包成 .ipa
        run: |
          set -euo pipefail
          WINNER=$(cat /tmp/winner)
          echo "选中的构建目录: $WINNER"
          APP="$WINNER/KVideoTV.app"
          if [ ! -d "$APP" ]; then
            echo "::error::没找到 $APP"
            exit 1
          fi
          echo "== .app 内容 =="
          ls -la "$APP"
          echo "== 确认图标进了 Assets.car =="
          xcrun --sdk appletvos assetutil --info "$APP/Assets.car" | grep -i -m6 "AppIcon" \
            || echo "(未匹配到 AppIcon，仍继续打包)"
          rm -rf Payload KVideoTV-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry KVideoTV-unsigned.ipa Payload
          ls -lh KVideoTV-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: KVideoTV-unsigned-ipa
          path: KVideoTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

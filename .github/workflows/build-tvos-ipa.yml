name: Build tvOS IPA (unsigned)

# 云端编译出未签名的 KVideoTV.ipa，供本地用 Sideloadly 签名安装到 Apple TV。
# 这样本机不需要安装 Xcode。
#
# 触发：仓库 Actions 页面点 "Run workflow"，或推到 main 分支。
#
# 注意：本 workflow 会把 .github/icon-report.md（图标诊断报告）提交回仓库，
# 因为 GitHub 的 job 日志未认证下载返回 403，本地读不到。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "KVideoTV/**"
      - "KVideoTV.xcodeproj/**"
      - ".github/workflows/build-tvos-ipa.yml"
      - ".github/build-tvos.sh"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 与 SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true

      - name: 编译 tvOS（不签名）+ 图标诊断
        run: bash .github/build-tvos.sh

      - name: 打包成 .ipa
        run: |
          set -euo pipefail
          WINNER=$(cat /tmp/winner)
          echo "选中的构建目录: $WINNER"
          APP="$WINNER/KVideoTV.app"
          if [ ! -d "$APP" ]; then
            echo "::error::没找到 $APP"
            exit 1
          fi
          echo "== .app 内容 =="
          ls -la "$APP"
          rm -rf Payload KVideoTV-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry KVideoTV-unsigned.ipa Payload
          ls -lh KVideoTV-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: KVideoTV-unsigned-ipa
          path: KVideoTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 回写图标诊断报告
        if: always()
        run: |
          if [ ! -f .github/icon-report.md ]; then
            echo "没有报告文件，跳过"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/icon-report.md
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
            exit 0
          fi
          git commit -q -m "ci: tvOS 图标诊断报告 [skip ci]"
          git push || echo "::warning::报告推送失败（不影响构建）"
